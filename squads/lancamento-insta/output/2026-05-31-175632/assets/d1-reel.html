<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bolão Pro | Copa 2026</title>
<!-- Google Fonts - Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { 
  margin: 0; 
  padding: 0; 
  box-sizing: border-box; 
  font-family: 'Inter', sans-serif;
}

html, body {
  background: #000;
  width: 100%;
  height: 100%;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

.reel {
  position: relative;
  width: 390px;
  height: 844px;
  background: #09090b;
  overflow: hidden;
  flex-shrink: 0;
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.05);
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
}

/* fullscreen mobile */
@media (max-width: 430px) {
  .reel {
    width: 100vw;
    height: 100vh;
    border-radius: 0;
    border: none;
  }
}

canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* ──────────── SCENES ──────────── */
.scene {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 40px 24px;
  text-align: center;
  opacity: 0;
  transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: none;
}
.scene.active { opacity: 1; pointer-events: auto; }

/* ──── Scene 1: Ponto de luz ──── */
#s1 .dot {
  width: 14px;
  height: 14px;
  background: #10b981;
  border-radius: 50%;
  box-shadow: 0 0 25px #10b981, 0 0 60px #10b981, 0 0 120px rgba(16,185,129,0.5);
  animation: pulse 1.4s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 20px #10b981, 0 0 60px #10b981; }
  50% { transform: scale(2.5); box-shadow: 0 0 40px #10b981, 0 0 100px #10b981, 0 0 200px rgba(16,185,129,0.3); }
}

#s1 .txt {
  color: #ffffff;
  font-size: 28px;
  font-weight: 900;
  letter-spacing: -0.05em;
  text-transform: uppercase;
  margin-top: 60px;
  opacity: 0;
  animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
}

/* ──── Scene 2: Silhueta ──── */
#s2 .glow-ring {
  position: absolute;
  width: 320px;
  height: 320px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(16,185,129,0.15) 0%, transparent 70%);
  animation: glowPulse 2.5s ease-in-out infinite;
}

@keyframes glowPulse {
  0%, 100% { transform: scale(1); opacity: 0.5; }
  50% { transform: scale(1.15); opacity: 0.9; }
}

#s2 .mago {
  font-size: 130px;
  line-height: 1;
  filter: drop-shadow(0 0 35px rgba(16,185,129,0.7));
  animation: magoFloat 3.5s ease-in-out infinite;
  position: relative;
  z-index: 1;
}

@keyframes magoFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}

#s2 .txt {
  color: #10b981;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.25;
  text-shadow: 0 0 20px rgba(16,185,129,0.5);
  margin-top: 40px;
  opacity: 0;
  animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
  position: relative;
  z-index: 1;
}

#s2 .txt span {
  color: #ffffff;
  display: block;
  font-size: 16px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 8px;
  opacity: 0.8;
}

/* ──── Scene 3: Mockup do app ──── */
#s3 .phone {
  width: 260px;
  background: #18181b;
  border-radius: 32px;
  border: 1px solid rgba(16,185,129,0.4);
  box-shadow: 0 15px 40px rgba(0,0,0,0.6), 0 0 30px rgba(16,185,129,0.2);
  overflow: hidden;
  padding: 8px;
}

#s3 .phone-inner {
  background: #09090b;
  border-radius: 24px;
  border: 1px solid rgba(255,255,255,0.03);
  overflow: hidden;
}

#s3 .ph-header {
  background: #18181b;
  padding: 16px 20px;
  border-bottom: 1px solid rgba(16,185,129,0.15);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

#s3 .ph-dot-container {
  display: flex;
  align-items: center;
  gap: 6px;
}

#s3 .ph-dot {
  width: 8px; height: 8px;
  background: #10b981;
  border-radius: 50%;
  box-shadow: 0 0 8px #10b981;
  animation: pulse 1.2s ease-in-out infinite;
}

#s3 .ph-title {
  color: #ffffff;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

#s3 .ph-body { padding: 18px 14px; }

#s3 .pote {
  background: linear-gradient(135deg, #022c22 0%, #064e3b 100%);
  border: 1px solid rgba(16,185,129,0.3);
  border-radius: 12px;
  padding: 16px 12px;
  margin-bottom: 16px;
  text-align: center;
  box-shadow: 0 4px 15px rgba(0,0,0,0.25);
  position: relative;
  overflow: hidden;
}

#s3 .pote::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at top right, rgba(251,191,36,0.1) 0%, transparent 60%);
}

#s3 .pote-label {
  color: #a1a1aa;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 6px;
}

#s3 .pote-val {
  color: #fbbf24;
  font-size: 32px;
  font-weight: 900;
  text-shadow: 0 0 15px rgba(251,191,36,0.4);
  animation: numPulse 2s ease-in-out infinite;
}

@keyframes numPulse {
  0%, 100% { transform: scale(1); text-shadow: 0 0 15px rgba(251,191,36,0.4); }
  50% { transform: scale(1.03); text-shadow: 0 0 25px rgba(251,191,36,0.6); }
}

#s3 .rank-row {
  display: flex;
  align-items: center;
  padding: 10px 12px;
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.03);
  border-radius: 8px;
  margin-bottom: 6px;
  font-size: 12px;
  color: #d4d4d8;
  opacity: 0;
}

#s3 .rank-row:nth-child(2) { animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards; }
#s3 .rank-row:nth-child(3) { animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards; }
#s3 .rank-row:nth-child(4) { animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.0s forwards; }

@keyframes slideIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

#s3 .rk-num { 
  color: #fbbf24; 
  font-weight: 800; 
  min-width: 20px; 
}
#s3 .rk-name {
  font-weight: 500;
  margin-left: 6px;
}
#s3 .rk-pts { 
  margin-left: auto; 
  color: #10b981; 
  font-weight: 700; 
}

#s3 .txt {
  color: #ffffff;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.35;
  margin-top: 32px;
  opacity: 0;
  animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.5s forwards;
}

#s3 .txt span {
  color: #10b981;
}

/* ──── Scene 4: Glitch ──── */
#s4 .glitch {
  position: relative;
  color: #ffffff;
  font-size: 40px;
  font-weight: 900;
  letter-spacing: -0.03em;
  text-transform: uppercase;
  animation: glitchShake 0.2s ease-in-out infinite;
}

#s4 .glitch::before {
  content: attr(data-t);
  position: absolute;
  top: 0; left: 0;
  color: #10b981;
  animation: glitchA 0.4s steps(1) infinite;
  clip-path: polygon(0 0, 100% 0, 100% 40%, 0 40%);
}

#s4 .glitch::after {
  content: attr(data-t);
  position: absolute;
  top: 0; left: 0;
  color: #fbbf24;
  animation: glitchB 0.6s steps(1) infinite;
  clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
}

@keyframes glitchShake {
  0%, 100% { transform: translate(0); }
  25% { transform: translate(-2px, 1px); }
  75% { transform: translate(2px, -1px); }
}

@keyframes glitchA {
  0%, 100% { transform: translate(0); opacity: 1; }
  33% { transform: translate(3px, -2px); opacity: 0.8; }
  66% { transform: translate(-3px, 1px); opacity: 0.9; }
}

@keyframes glitchB {
  0%, 100% { transform: translate(0); opacity: 1; }
  33% { transform: translate(-2px, 2px); opacity: 0.7; }
  66% { transform: translate(2px, -1px); opacity: 0.8; }
}

#s4 .cta-emoji {
  font-size: 80px;
  margin-top: 48px;
  filter: drop-shadow(0 0 35px rgba(16,185,129,0.8));
  animation: emojiAppear 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.6s forwards, emojiGlow 1s ease-in-out 1.2s infinite;
  opacity: 0;
}

@keyframes emojiAppear {
  from { opacity: 0; transform: scale(0.4) rotate(-15deg); }
  to { opacity: 1; transform: scale(1) rotate(0); }
}

@keyframes emojiGlow {
  0%, 100% { filter: drop-shadow(0 0 25px rgba(16,185,129,0.8)); transform: scale(1); }
  50% { filter: drop-shadow(0 0 50px rgba(16,185,129,1)); transform: scale(1.06); }
}

#s4 .txt-cta {
  color: #a1a1aa;
  font-size: 15px;
  font-weight: 500;
  margin-top: 30px;
  opacity: 0;
  animation: fadeUp 0.8s ease 1s forwards;
}

/* ──── Scene 5: Logo final ──── */
#s5 .logo-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

#s5 .logo-mago {
  font-size: 110px;
  filter: drop-shadow(0 0 45px rgba(10,185,129,0.6));
  animation: magoFloat 3.5s ease-in-out infinite;
}

#s5 .logo-name {
  color: #ffffff;
  font-size: 32px;
  font-weight: 900;
  letter-spacing: -0.04em;
}

#s5 .logo-name span {
  color: #10b981;
  text-shadow: 0 0 20px rgba(16,185,129,0.4);
}

#s5 .logo-sub {
  color: #a1a1aa;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-top: -12px;
}

#s5 .em-breve {
  color: #fbbf24;
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  margin-top: 40px;
  opacity: 0;
  animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
  text-shadow: 0 0 15px rgba(251,191,36,0.3);
}

/* ──────────── UTILITIES ──────────── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* progress bar */
.pbar {
  position: absolute;
  top: 0; left: 0;
  height: 4px;
  width: 0%;
  background: #10b981;
  box-shadow: 0 0 10px #10b981;
  transition: none;
  z-index: 10;
}

/* restart button */
.btn-restart {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: #10b981;
  color: #09090b;
  border: none;
  padding: 12px 20px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  z-index: 99;
  letter-spacing: 0.02em;
  box-shadow: 0 10px 20px rgba(16, 185, 129, 0.25);
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 8px;
}

.btn-restart:hover { 
  background: #34d399;
  transform: translateY(-2px);
  box-shadow: 0 12px 24px rgba(16, 185, 129, 0.35);
}

.btn-restart:active {
  transform: translateY(0);
}
</style>
</head>
<body>

<div class="reel" id="reel">
  <canvas id="cv"></canvas>

  <!-- S1: Ponto de luz -->
  <div class="scene active" id="s1">
    <div class="dot"></div>
    <div class="txt">A Copa de 2026...</div>
  </div>

  <!-- S2: Silhueta do Mago -->
  <div class="scene" id="s2">
    <div class="glow-ring"></div>
    <div class="mago">🧙‍♂️</div>
    <div class="txt"><span>Prepare-se</span>Tem um novo Mago.</div>
  </div>

  <!-- S3: Mockup do app -->
  <div class="scene" id="s3">
    <div class="phone">
      <div class="phone-inner">
        <div class="ph-header">
          <div class="ph-title">Bolão Pro 🪄</div>
          <div class="ph-dot-container">
            <div class="ph-dot"></div>
          </div>
        </div>
        <div class="ph-body">
          <div class="pote">
            <div class="pote-label">O Pote Dourado</div>
            <div class="pote-val">R$ 900,00</div>
          </div>
          <div class="rank-row">
            <span class="rk-num">1º</span>
            <span class="rk-name">Kevin 🧙‍♂️</span>
            <span class="rk-pts">148 pts</span>
          </div>
          <div class="rank-row">
            <span class="rk-num">2º</span>
            <span class="rk-name">Osvaldo ⚽</span>
            <span class="rk-pts">132 pts</span>
          </div>
          <div class="rank-row">
            <span class="rk-num">3º</span>
            <span class="rk-name">Fabinho 🔥</span>
            <span class="rk-pts">121 pts</span>
          </div>
        </div>
      </div>
    </div>
    <div class="txt">Seu bolão nunca mais<br>será o mesmo.</div>
  </div>

  <!-- S4: Glitch freeze -->
  <div class="scene" id="s4">
    <div class="glitch" data-t="GARANTA SUA VAGA">GARANTA SUA VAGA</div>
    <div class="cta-emoji">⚽🏆</div>
    <div class="txt-cta">O Pote está acumulando!</div>
  </div>

  <!-- S5: Logo final -->
  <div class="scene" id="s5">
    <div class="logo-wrap">
      <div class="logo-mago">🧙‍♂️</div>
      <div class="logo-name">Bolão <span>Pro</span></div>
      <div class="logo-sub">O Bolão do Mago</div>
      <div class="em-breve">Copa 2026</div>
    </div>
  </div>

  <div class="pbar" id="pbar"></div>
</div>

<button class="btn-restart" onclick="location.reload()">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
  Reiniciar Reel
</button>

<script>
// ── Partículas ──
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const reel = document.getElementById('reel');

cv.width  = reel.offsetWidth;
cv.height = reel.offsetHeight;

const pts = Array.from({length: 60}, () => ({
  x:  Math.random() * cv.width,
  y:  Math.random() * cv.height,
  r:  Math.random() * 1.5 + 0.5,
  dx: (Math.random() - 0.5) * 0.3,
  dy: (Math.random() - 0.5) * 0.3,
  ph: Math.random() * Math.PI * 2,
}));

(function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  pts.forEach(p => {
    p.x = (p.x + p.dx + cv.width)  % cv.width;
    p.y = (p.y + p.dy + cv.height) % cv.height;
    p.ph += 0.02;
    const a = 0.1 + 0.5 * (0.5 + 0.5 * Math.sin(p.ph));
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.shadowBlur = 8;
    ctx.shadowColor = '#10b981';
    ctx.fillStyle = `rgba(16,185,129,${a})`;
    ctx.fill();
  });
  requestAnimationFrame(draw);
})();

// ── Timeline ──
const timeline = [
  ['s1', 0,     3500],
  ['s2', 3500,  7500],
  ['s3', 7500,  13500],
  ['s4', 13500, 17500],
  ['s5', 17500, 22000],
];

const TOTAL = 22000;
const t0 = performance.now();

const pbar = document.getElementById('pbar');

(function tick() {
  const elapsed = performance.now() - t0;

  pbar.style.width = Math.min(elapsed / TOTAL * 100, 100) + '%';

  timeline.forEach(([id, start, end]) => {
    const el = document.getElementById(id);
    const active = elapsed >= start && elapsed < end;
    if (active && !el.classList.contains('active')) el.classList.add('active');
    if (!active && el.classList.contains('active'))  el.classList.remove('active');
  });

  if (elapsed < TOTAL) requestAnimationFrame(tick);
})();
</script>

</body>
</html>
