<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolão Pro | Hub de Postagens & Carrosséis</title>
<!-- Google Fonts - Inter & Outfit -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
* { 
  margin: 0; 
  padding: 0; 
  box-sizing: border-box; 
  font-family: 'Inter', sans-serif; 
}

:root {
  --bg-color: #000000;
  --panel-bg: #09090b;
  --primary: #10b981;
  --primary-glow: rgba(16, 185, 129, 0.3);
  --yellow: #fbbf24;
  --orange: #f97316;
  --text-muted: #71717a;
  --border: rgba(255, 255, 255, 0.06);
}

body {
  background: var(--bg-color);
  min-height: 100vh;
  color: #ffffff;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}

/* ── HEADER ── */
header {
  width: 100%;
  max-width: 1200px;
  padding: 40px 20px 20px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  border-bottom: 1px solid var(--border);
}

.logo-main {
  font-family: 'Outfit', sans-serif;
  color: var(--primary);
  font-size: 24px;
  font-weight: 900;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 8px;
  text-shadow: 0 0 20px var(--primary-glow);
  display: flex;
  align-items: center;
  gap: 8px;
}

.logo-main span {
  color: #ffffff;
}

.logo-main-dot {
  width: 12px;
  height: 12px;
  background: var(--primary);
  border-radius: 50%;
  box-shadow: 0 0 12px var(--primary);
}

h1 {
  font-size: 32px;
  font-weight: 800;
  margin-top: 10px;
  background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.subtitle {
  color: var(--text-muted);
  font-size: 14px;
  font-weight: 500;
  margin-top: 8px;
  max-width: 600px;
  line-height: 1.6;
}

/* ── CONTROLS PANEL ── */
.controls-container {
  width: 100%;
  max-width: 1200px;
  padding: 24px 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  justify-content: space-between;
  align-items: center;
  z-index: 100;
}

.tabs {
  display: flex;
  background: rgba(255, 255, 255, 0.03);
  padding: 4px;
  border-radius: 12px;
  border: 1px solid var(--border);
}

.tab-btn {
  background: transparent;
  border: none;
  color: #a1a1aa;
  padding: 10px 20px;
  font-size: 13px;
  font-weight: 700;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  align-items: center;
  gap: 8px;
}

.tab-btn.active {
  background: var(--primary);
  color: #000000;
  box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
}

.view-toggle {
  display: flex;
  background: rgba(255, 255, 255, 0.03);
  padding: 4px;
  border-radius: 12px;
  border: 1px solid var(--border);
}

.toggle-btn {
  background: transparent;
  border: none;
  color: #a1a1aa;
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  gap: 6px;
}

.toggle-btn.active {
  background: rgba(255, 255, 255, 0.08);
  color: #ffffff;
}

/* ── LAYOUT MAIN ── */
.workspace-layout {
  display: flex;
  width: 100%;
  max-width: 1200px;
  padding: 0 20px 80px 20px;
  gap: 32px;
  align-items: flex-start;
}

.preview-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ── GRID MODE ── */
.slides-grid {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 48px;
  width: 100%;
}

.slides-grid.hidden {
  display: none;
}

/* ── INTERACTIVE CAROUSEL MODE ── */
.interactive-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  width: 100%;
}

.interactive-container.hidden {
  display: none;
}

.phone-shell {
  width: 460px;
  background: #09090b;
  border-radius: 40px;
  border: 6px solid #18181b;
  padding: 20px;
  box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.02);
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
}

.phone-notch {
  width: 140px;
  height: 20px;
  background: #18181b;
  border-radius: 0 0 16px 16px;
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
}

.carousel-viewport {
  width: 420px;
  height: 420px;
  position: relative;
  overflow: hidden;
  border-radius: 24px;
}

.carousel-track {
  display: flex;
  width: 100%;
  height: 100%;
  transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
}

.carousel-track .slide {
  flex-shrink: 0;
}

.carousel-nav {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-top: 10px;
  width: 100%;
  justify-content: space-between;
}

.nav-arrow {
  background: #18181b;
  border: 1px solid rgba(255,255,255,0.08);
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ffffff;
  font-size: 18px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.nav-arrow:hover {
  background: var(--primary);
  color: #000000;
  border-color: var(--primary);
  box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
}

.carousel-dots {
  display: flex;
  gap: 8px;
}

.dot {
  width: 8px;
  height: 8px;
  background: rgba(255,255,255,0.2);
  border-radius: 50%;
  cursor: pointer;
  transition: all 0.3s ease;
}

.dot.active {
  background: var(--primary);
  transform: scale(1.3);
  box-shadow: 0 0 8px var(--primary);
}

/* ── SIDEBAR (COPY & HASHTAGS) ── */
.sidebar-panel {
  width: 380px;
  background: #09090b;
  border-radius: 20px;
  border: 1px solid var(--border);
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  position: sticky;
  top: 40px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.5);
}

.panel-title {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #ffffff;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 12px;
}

.copy-box {
  background: #000000;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.04);
  padding: 16px;
  font-size: 13px;
  line-height: 1.6;
  color: #e4e4e7;
  white-space: pre-wrap;
  max-height: 320px;
  overflow-y: auto;
  position: relative;
  font-family: 'Inter', sans-serif;
}

.copy-btn {
  background: var(--primary);
  color: #09090b;
  border: none;
  border-radius: 8px;
  padding: 12px;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s ease;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.copy-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
}

/* ── SLIDE COMPONENT ── */
.slide-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  width: 100%;
}

.slide-label {
  color: #a1a1aa;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.slide {
  width: 420px;
  height: 420px;
  background: #09090b;
  border-radius: 24px;
  border: 1px solid rgba(255,255,255,0.06);
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
  box-shadow: 0 20px 40px rgba(0,0,0,0.6);
}

/* ── Elementos comuns ── */
.logo-badge {
  position: absolute;
  top: 24px;
  right: 24px;
  display: flex;
  align-items: center;
  gap: 6px;
  z-index: 10;
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(10px);
  padding: 6px 12px;
  border-radius: 30px;
  border: 1px solid rgba(255, 255, 255, 0.03);
}

.logo-dot {
  width: 8px; height: 8px;
  background: #10b981;
  border-radius: 50%;
  box-shadow: 0 0 10px #10b981;
}

.logo-text {
  color: #ffffff;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

.logo-text span {
  color: #10b981;
}

.slide-num {
  position: absolute;
  bottom: 24px;
  left: 24px;
  color: rgba(255,255,255,0.25);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  z-index: 10;
}

.green-line {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, transparent, #10b981, transparent);
}

.particles-bg {
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(circle, rgba(16,185,129,0.06) 1.5px, transparent 1.5px),
    radial-gradient(circle, rgba(16,185,129,0.03) 1.5px, transparent 1.5px);
  background-size: 40px 40px, 20px 20px;
  background-position: 0 0, 10px 10px;
  pointer-events: none;
}

/* ════════════════════════════════
   CARROSSEL 1 - LANÇAMENTO GERAL
════════════════════════════════ */
#s1_1 {
  background: radial-gradient(circle at 50% 30%, rgba(16,185,129,0.18) 0%, transparent 60%), #09090b;
}

#s1_1 .hero {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px;
}

#s1_1 .mago-emoji {
  font-size: 80px;
  line-height: 1;
  filter: drop-shadow(0 0 25px rgba(16,185,129,0.6));
  margin-bottom: 20px;
  animation: float 4s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

#s1_1 .eyebrow {
  color: #10b981;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 12px;
  text-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
}

#s1_1 .headline {
  color: #ffffff;
  font-size: 32px;
  font-weight: 900;
  letter-spacing: -0.04em;
  line-height: 1.15;
  text-align: center;
}

#s1_1 .headline span {
  color: #10b981;
  text-shadow: 0 0 20px rgba(16,185,129,0.4);
}

#s1_1 .tagline {
  color: #a1a1aa;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-top: 24px;
  background: rgba(255,255,255,0.03);
  padding: 6px 14px;
  border-radius: 30px;
  border: 1px solid rgba(255,255,255,0.05);
}

/* SLIDE 1_2 — PROBLEMA */
#s1_2 {
  background: #09090b;
}
#s1_2 .content {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  padding: 40px 36px;
}
#s1_2 .before-tag {
  background: rgba(239,68,68,0.1);
  border: 1px solid rgba(239,68,68,0.25);
  border-radius: 8px;
  padding: 5px 12px;
  color: #ef4444;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 18px;
}
#s1_2 .headline {
  color: #ffffff;
  font-size: 30px;
  font-weight: 900;
  letter-spacing: -0.04em;
  line-height: 1.15;
  margin-bottom: 24px;
}
#s1_2 .problems {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
}
#s1_2 .prob-item {
  display: flex;
  align-items: center;
  gap: 12px;
  color: #d4d4d8;
  font-size: 14px;
  font-weight: 500;
  background: rgba(255,255,255,0.02);
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.03);
  width: 100%;
}
#s1_2 .prob-icon {
  font-size: 18px;
  flex-shrink: 0;
}
#s1_2 .divider {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, #ef4444, transparent);
}

/* SLIDE 1_3 — PRODUTO */
#s1_3 {
  background: radial-gradient(circle at 80% 80%, rgba(16,185,129,0.12) 0%, transparent 60%), #09090b;
}
#s1_3 .content {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  padding: 36px 32px;
}
#s1_3 .after-tag {
  background: rgba(16,185,129,0.1);
  border: 1px solid rgba(16,185,129,0.25);
  border-radius: 8px;
  padding: 5px 12px;
  color: #10b981;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 18px;
}
#s1_3 .headline {
  color: #ffffff;
  font-size: 26px;
  font-weight: 900;
  letter-spacing: -0.03em;
  line-height: 1.2;
  margin-bottom: 24px;
}
#s1_3 .headline span { color: #10b981; }
#s1_3 .mockup {
  width: 100%;
  background: #18181b;
  border-radius: 20px;
  border: 1px solid rgba(16,185,129,0.3);
  overflow: hidden;
  box-shadow: 0 12px 30px rgba(0,0,0,0.5);
  padding: 6px;
}
#s1_3 .mk-inner {
  background: #09090b;
  border-radius: 14px;
  overflow: hidden;
}
#s1_3 .mk-header {
  background: #18181b;
  padding: 10px 14px;
  border-bottom: 1px solid rgba(16,185,129,0.1);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
#s1_3 .mk-dot { width: 6px; height: 6px; background: #10b981; border-radius: 50%; box-shadow: 0 0 6px #10b981; }
#s1_3 .mk-title { color: #ffffff; font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
#s1_3 .mk-body { padding: 14px; }
#s1_3 .mk-pote {
  background: linear-gradient(135deg, #022c22, #064e3b);
  border: 1px solid rgba(16,185,129,0.25);
  border-radius: 10px;
  padding: 12px;
  text-align: center;
}
#s1_3 .mk-pote-lbl { color: #a1a1aa; font-size: 8px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
#s1_3 .mk-pote-val { color: #fbbf24; font-size: 24px; font-weight: 900; margin-top: 2px; text-shadow: 0 0 10px rgba(251,191,36,0.3); }

/* SLIDE 1_4 — TESOURARIA PIX */
#s1_4 {
  background: radial-gradient(circle at 20% 50%, rgba(16,185,129,0.1) 0%, transparent 60%), #09090b;
}
#s1_4 .content {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 36px 32px;
  text-align: center;
}
#s1_4 .pix-icon {
  font-size: 64px;
  filter: drop-shadow(0 0 20px rgba(16,185,129,0.5));
  margin-bottom: 20px;
}
#s1_4 .headline {
  color: #ffffff;
  font-size: 28px;
  font-weight: 900;
  letter-spacing: -0.04em;
  line-height: 1.15;
  margin-bottom: 10px;
}
#s1_4 .headline span { color: #10b981; }
#s1_4 .sub {
  color: #a1a1aa;
  font-size: 13px;
  font-weight: 500;
  line-height: 1.5;
  margin-bottom: 24px;
}
#s1_4 .badge-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
}
#s1_4 .badge {
  background: rgba(16,185,129,0.08);
  border: 1px solid rgba(16,185,129,0.2);
  border-radius: 30px;
  padding: 6px 14px;
  color: #10b981;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
}

/* SLIDE 1_5 — RANKINGS */
#s1_5 { background: #09090b; }
#s1_5 .content {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  padding: 36px 32px;
}
#s1_5 .headline {
  color: #ffffff;
  font-size: 26px;
  font-weight: 900;
  letter-spacing: -0.03em;
  line-height: 1.15;
  margin-bottom: 6px;
}
#s1_5 .headline span { color: #10b981; }
#s1_5 .sub { color: #a1a1aa; font-size: 13px; font-weight: 500; margin-bottom: 18px; }
#s1_5 .ranking { width: 100%; display: flex; flex-direction: column; gap: 6px; }
#s1_5 .rank-row {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.04);
  border-radius: 12px;
  padding: 8px 12px;
}
#s1_5 .rank-row.first {
  background: linear-gradient(90deg, rgba(251,191,36,0.08), transparent);
  border-color: rgba(251,191,36,0.25);
}
#s1_5 .rk-pos { font-size: 13px; font-weight: 900; min-width: 24px; text-align: center; }
#s1_5 .rk-pos.gold { color: #fbbf24; }
#s1_5 .rk-pos.silver { color: #a1a1aa; }
#s1_5 .rk-pos.bronze { color: #b45309; }
#s1_5 .rk-name { font-size: 13px; font-weight: 600; color: #e4e4e7; flex: 1; }
#s1_5 .rk-pts { font-size: 13px; font-weight: 800; color: #10b981; margin-left: auto; }
#s1_5 .live-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 12px;
  background: rgba(239, 68, 68, 0.08);
  border: 1px solid rgba(239, 68, 68, 0.2);
  padding: 4px 10px;
  border-radius: 20px;
}
#s1_5 .live-dot {
  width: 6px; height: 6px;
  background: #ef4444;
  border-radius: 50%;
  box-shadow: 0 0 6px #ef4444;
  animation: livePulse 1.2s ease-in-out infinite;
}
#s1_5 .live-txt { color: #ef4444; font-size: 9px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }

/* SLIDE 1_6 — PERGUNTAS BÔNUS */
#s1_6 {
  background: radial-gradient(circle at 50% 50%, rgba(16,185,129,0.08) 0%, transparent 65%), #09090b;
}
#s1_6 .content {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 36px 32px;
  text-align: center;
}
#s1_6 .feature-icon { font-size: 56px; margin-bottom: 14px; filter: drop-shadow(0 0 20px rgba(16,185,129,0.5)); }
#s1_6 .headline {
  color: #ffffff;
  font-size: 24px;
  font-weight: 900;
  letter-spacing: -0.03em;
  line-height: 1.2;
  margin-bottom: 18px;
}
#s1_6 .headline span { color: #10b981; }
#s1_6 .questions { display: flex; flex-direction: column; gap: 8px; width: 100%; }
#s1_6 .q-item {
  background: rgba(255,255,255,0.01);
  border: 1px solid rgba(16,185,129,0.2);
  border-radius: 10px;
  padding: 10px 14px;
  color: #e4e4e7;
  font-size: 12px;
  font-weight: 600;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 10px;
}
#s1_6 .q-item .q-icon { font-size: 16px; }

/* SLIDE 1_7 — PWA */
#s1_7 { background: #09090b; }
#s1_7 .content {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 36px 32px;
  text-align: center;
}
#s1_7 .pwa-icon { font-size: 64px; margin-bottom: 16px; }
#s1_7 .headline {
  color: #ffffff;
  font-size: 28px;
  font-weight: 900;
  letter-spacing: -0.04em;
  line-height: 1.15;
  margin-bottom: 10px;

let currentPost = 1;
let currentSlideIndex = 0;
let currentViewMode = 'grid'; // 'grid' | 'carousel'

function init() {
  renderContent();
}

function switchPost(postId) {
  currentPost = postId;
  currentSlideIndex = 0;
  
  // Update tabs active state
  const tabs = document.querySelectorAll('.tab-btn');
  tabs.forEach((tab, index) => {
    if (index + 1 === postId) {
      tab.classList.add('active');
    } else {
      tab.classList.remove('active');
    }
  });

  renderContent();
}

function setViewMode(mode) {
  currentViewMode = mode;
  
  const btnGrid = document.getElementById('btn-grid');
  const btnCarousel = document.getElementById('btn-carousel');
  const gridView = document.getElementById('grid-view');
  const carouselView = document.getElementById('carousel-view');

  if (mode === 'grid') {
    btnGrid.classList.add('active');
    btnCarousel.classList.remove('active');
    gridView.classList.remove('hidden');
    carouselView.classList.add('hidden');
  } else {
    btnGrid.classList.remove('active');
    btnCarousel.classList.add('active');
    gridView.classList.add('hidden');
    carouselView.classList.remove('hidden');
    updateCarouselPosition();
  }
}

function renderContent() {
  const post = postData[currentPost];
  
  // Render Caption Copy Text
  document.getElementById('caption-text').textContent = post.caption;

  // Render Grid View
  const gridView = document.getElementById('grid-view');
  gridView.innerHTML = '';
  post.slides.forEach(slide => {
    const wrap = document.createElement('div');
    wrap.className = 'slide-wrap';
    wrap.innerHTML = `
      <div class="slide-label">${slide.label}</div>
      ${slide.html}
    `;
    gridView.appendChild(wrap);
  });

  // Render Carousel View
  const track = document.getElementById('carousel-track');
  track.innerHTML = '';
  post.slides.forEach(slide => {
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = slide.html.trim();
    track.appendChild(tempDiv.firstChild);
  });

  // Render Dots
  const dotsContainer = document.getElementById('carousel-dots');
  dotsContainer.innerHTML = '';
  post.slides.forEach((_, index) => {
    const dot = document.createElement('div');
    dot.className = `dot ${index === currentSlideIndex ? 'active' : ''}`;
    dot.onclick = () => goToSlide(index);
    dotsContainer.appendChild(dot);
  });

  if (currentViewMode === 'carousel') {
    updateCarouselPosition();
  }
}

function updateCarouselPosition() {
  const track = document.getElementById('carousel-track');
  track.style.transform = `translateX(-${currentSlideIndex * 420}px)`;

  // Update dots
  const dots = document.querySelectorAll('.dot');
  dots.forEach((dot, index) => {
    if (index === currentSlideIndex) {
      dot.classList.add('active');
    } else {
      dot.classList.remove('active');
    }
  });
}

function nextSlide() {
  const maxSlides = postData[currentPost].slides.length;
  currentSlideIndex = (currentSlideIndex + 1) % maxSlides;
  updateCarouselPosition();
}

function prevSlide() {
  const maxSlides = postData[currentPost].slides.length;
  currentSlideIndex = (currentSlideIndex - 1 + maxSlides) % maxSlides;
  updateCarouselPosition();
}

function goToSlide(index) {
  currentSlideIndex = index;
  updateCarouselPosition();
}

function copyCaption() {
  const caption = postData[currentPost].caption;
  navigator.clipboard.writeText(caption).then(() => {
    const btn = document.querySelector('.copy-btn');
    const originalText = btn.innerHTML;
    btn.innerHTML = '✓ Copiado!';
    btn.style.background = '#ffffff';
    btn.style.color = '#000000';
    setTimeout(() => {
      btn.innerHTML = originalText;
      btn.style.background = 'var(--primary)';
      btn.style.color = '#09090b';
    }, 2000);
  }).catch(err => {
    console.error('Erro ao copiar: ', err);
  });
}

// Inicializar
init();
</script>
