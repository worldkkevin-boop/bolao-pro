<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-[#09090b] text-white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ TERMINAL DO MAGO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .scanline {
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(16,185,129,0.015) 2px, rgba(16,185,129,0.015) 4px);
      pointer-events: none;
    }
    .bar-fill { transition: width 0.6s ease; }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="h-full flex flex-col overflow-hidden bg-[#09090b]" x-data="terminalApp()" x-init="init()">

<!-- Scanline overlay -->
<div class="fixed inset-0 scanline z-[1] pointer-events-none opacity-40"></div>

<!-- ===================== LOADING ===================== -->
<div x-show="loading" class="fixed inset-0 bg-[#09090b] z-50 flex flex-col items-center justify-center gap-3">
  <div class="w-8 h-8 border-2 border-[#10b981] border-t-transparent rounded-full animate-spin"></div>
  <p class="text-[#10b981] font-mono text-xs tracking-widest uppercase">INICIALIZANDO SISTEMA...</p>
</div>

<!-- ===================== LOGIN ===================== -->
<div x-show="!loading && !usuario" x-cloak class="fixed inset-0 bg-[#09090b] z-40 flex items-center justify-center p-6">
  <div class="w-full max-w-sm border border-[#10b981]/30 rounded-xl p-8 bg-[#0d1a13]">
    <div class="flex items-center gap-3 mb-6">
      <span class="text-2xl">⚡</span>
      <div>
        <h1 class="font-black text-[#10b981] tracking-widest uppercase text-sm">Terminal do Mago</h1>
        <p class="text-gray-600 text-[10px] font-mono">ACESSO RESTRITO — GM ONLY</p>
      </div>
    </div>
    <button @click="entrarComGoogle()" class="w-full bg-white text-black font-bold py-3 rounded-lg flex items-center justify-center gap-2 text-sm hover:bg-gray-100 transition-colors">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Autenticar com Google
    </button>
  </div>
</div>

<!-- ===================== PIN ===================== -->
<div x-show="!loading && usuario && acessoAutorizado && !pinDesbloqueado" x-cloak class="fixed inset-0 bg-[#09090b] z-40 flex items-center justify-center p-6">
  <div class="w-full max-w-xs border border-[#10b981]/30 rounded-xl p-8 bg-[#0d1a13]">
    <p class="text-[#10b981] font-mono text-[10px] uppercase tracking-widest mb-1">AUTENTICAÇÃO DE 2 FATORES</p>
    <h2 class="font-black text-white text-lg mb-5">Código PIN</h2>
    <input
      type="password" maxlength="6" x-model="pinInput"
      @keydown.enter="verificarPin()"
      class="w-full bg-black border font-mono text-center text-xl tracking-[0.5em] py-3 rounded-lg outline-none transition-colors"
      :class="pinErro ? 'border-red-500 text-red-400' : 'border-[#10b981]/40 text-[#10b981] focus:border-[#10b981]'"
      placeholder="••••"
    >
    <p x-show="pinErro" class="text-red-400 text-[10px] font-mono mt-2 text-center">ACESSO NEGADO</p>
    <button @click="verificarPin()" class="mt-4 w-full bg-[#10b981] text-black font-black py-2.5 rounded-lg text-sm tracking-widest uppercase hover:bg-[#059669] transition-colors">
      DESBLOQUEAR
    </button>
  </div>
</div>

<!-- ===================== ACESSO NEGADO ===================== -->
<div x-show="!loading && usuario && !acessoAutorizado" x-cloak class="fixed inset-0 bg-[#09090b] z-40 flex items-center justify-center">
  <div class="text-center">
    <p class="text-red-500 font-mono text-xs uppercase tracking-widest mb-3">ACESSO NEGADO</p>
    <p class="text-gray-500 text-sm mb-4" x-text="usuario?.email"></p>
    <button @click="deslogar()" class="text-[10px] text-[#10b981] hover:underline font-mono uppercase tracking-widest">Sair</button>
  </div>
</div>

<!-- ===================== TERMINAL PRINCIPAL ===================== -->
<template x-if="!loading && usuario && acessoAutorizado && pinDesbloqueado">
  <div class="flex flex-col h-full relative z-10">

    <!-- TOP BAR -->
    <div class="flex-shrink-0 h-10 bg-[#0a0a0c] border-b border-[#10b981]/20 flex items-center justify-between px-4">
      <div class="flex items-center gap-3">
        <span class="text-[#10b981] text-sm">⚡</span>
        <span class="font-mono text-[#10b981] text-xs font-bold tracking-widest uppercase">TERMINAL DO MAGO</span>
        <span class="text-gray-700 text-xs font-mono">v2.0</span>
      </div>
      <div class="flex items-center gap-4">
        <span class="font-mono text-[#10b981] text-xs" x-text="relogio"></span>
        <span class="text-gray-600 text-[10px] font-mono">|</span>
        <span class="flex items-center gap-1.5 text-[10px] font-mono text-gray-400">
          <span class="w-1.5 h-1.5 rounded-full bg-[#10b981] animate-pulse"></span>ONLINE
        </span>
        <button @click="deslogar()" class="text-[10px] font-mono text-gray-600 hover:text-red-400 uppercase tracking-wider transition-colors">SAIR</button>
        <a href="gm.html" class="text-[10px] font-mono text-gray-600 hover:text-[#10b981] uppercase tracking-wider transition-colors">← GM</a>
      </div>
    </div>

    <!-- TAB BAR -->
    <div class="flex-shrink-0 bg-[#09090b] border-b border-white/5 flex items-center px-4 gap-0">
      <template x-for="tab in [
        { id: 'global',   label: 'VISÃO GLOBAL', icon: '◈' },
        { id: 'oraculo',  label: 'ORÁCULO',      icon: '◉' },
        { id: 'desafios', label: 'DESAFIOS',      icon: '◆' },
        { id: 'logs',     label: 'LOGS',          icon: '▸' }
      ]" :key="tab.id">
        <button
          @click="abaAtiva = tab.id"
          class="px-4 py-2.5 text-[10px] font-mono uppercase tracking-widest transition-all border-b-2"
          :class="abaAtiva === tab.id
            ? 'text-[#10b981] border-[#10b981]'
            : 'text-gray-600 border-transparent hover:text-gray-400'"
        >
          <span class="mr-1.5" x-text="tab.icon"></span>
          <span x-text="tab.label"></span>
        </button>
      </template>
      <div class="ml-auto flex items-center gap-2 pr-1">
        <button @click="carregarMetricas()" class="text-[9px] font-mono text-gray-700 hover:text-[#10b981] uppercase tracking-widest transition-colors px-2 py-1 border border-white/5 rounded">
          ↺ REFRESH
        </button>
      </div>
    </div>

    <!-- CONTENT AREA -->
    <div class="flex-1 overflow-y-auto">

      <!-- =================== TAB: VISÃO GLOBAL =================== -->
      <div x-show="abaAtiva === 'global'" class="p-5 space-y-5">

        <!-- Stat Cards -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
          <template x-for="card in [
            { label: 'USUÁRIOS',   value: metricas.usuarios,  icon: '◈', color: '#10b981' },
            { label: 'GRUPOS',     value: metricas.grupos,    icon: '◉', color: '#10b981' },
            { label: 'PALPITES',   value: metricas.palpites,  icon: '▸', color: '#6366f1' },
            { label: 'DESAFIOS',   value: metricas.desafios,  icon: '◆', color: '#f59e0b' }
          ]" :key="card.label">
            <div class="bg-[#0d0d0f] border border-white/5 rounded-xl p-4 relative overflow-hidden">
              <div class="absolute right-3 top-3 text-xl opacity-10" x-text="card.icon" :style="'color:' + card.color"></div>
              <p class="text-[9px] font-mono text-gray-600 uppercase tracking-widest mb-2" x-text="card.label"></p>
              <div x-show="metricas.loading" class="h-7 w-16 bg-white/5 rounded animate-pulse"></div>
              <p x-show="!metricas.loading" class="font-mono font-bold text-2xl" :style="'color:' + card.color" x-text="card.value.toLocaleString('pt-BR')"></p>
            </div>
          </template>
        </div>

        <!-- Fichas + Receita Simulada -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
          <div class="bg-[#0d0d0f] border border-white/5 rounded-xl p-4">
            <p class="text-[9px] font-mono text-gray-600 uppercase tracking-widest mb-3">FICHAS EM CIRCULAÇÃO</p>
            <div x-show="metricas.loading" class="h-8 w-24 bg-white/5 rounded animate-pulse"></div>
            <div x-show="!metricas.loading" class="flex items-end gap-3">
              <span class="font-mono font-bold text-3xl text-yellow-400" x-text="metricas.fichas"></span>
              <span class="text-yellow-400/50 font-mono text-xs mb-1">fichas</span>
            </div>
            <p class="text-gray-600 text-[10px] font-mono mt-2">
              Média: <span class="text-gray-400" x-text="metricas.usuarios > 0 ? (metricas.fichas / metricas.usuarios).toFixed(1) : '—'"></span> fichas/jogador
            </p>
          </div>

          <div class="bg-[#0d0d0f] border border-white/5 rounded-xl p-4">
            <p class="text-[9px] font-mono text-gray-600 uppercase tracking-widest mb-3">RECEITA SIMULADA (FASE 2)</p>
            <div class="space-y-1.5">
              <div class="flex justify-between items-center">
                <span class="text-gray-500 font-mono text-[10px]">Fichas vendidas (proj.)</span>
                <span class="text-[#10b981] font-mono text-xs font-bold">R$ —</span>
              </div>
              <div class="flex justify-between items-center">
                <span class="text-gray-500 font-mono text-[10px]">Desafios pagos (proj.)</span>
                <span class="text-[#10b981] font-mono text-xs font-bold">R$ —</span>
              </div>
              <div class="h-px bg-white/5 my-1"></div>
              <div class="flex justify-between items-center">
                <span class="text-gray-400 font-mono text-[10px] font-bold">TOTAL</span>
                <span class="text-white font-mono text-sm font-black">R$ 0,00</span>
              </div>
            </div>
            <p class="text-gray-700 text-[9px] font-mono mt-2">* Integração de pagamentos em breve</p>
          </div>
        </div>

        <!-- Status do sistema -->
        <div class="bg-[#0d0d0f] border border-white/5 rounded-xl p-4">
          <p class="text-[9px] font-mono text-gray-600 uppercase tracking-widest mb-3">STATUS DO SISTEMA</p>
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
            <template x-for="sys in [
              { label: 'Supabase DB',      status: 'ONLINE', color: '#10b981' },
              { label: 'API-Football',     status: 'ONLINE', color: '#10b981' },
              { label: 'MercadoPago PIX',  status: 'ONLINE', color: '#10b981' },
              { label: 'Web Push',         status: 'ONLINE', color: '#10b981' }
            ]" :key="sys.label">
              <div class="flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full flex-shrink-0" :style="'background:' + sys.color"></span>
                <div>
                  <p class="font-mono text-[10px] text-gray-400" x-text="sys.label"></p>
                  <p class="font-mono text-[9px]" :style="'color:' + sys.color" x-text="sys.status"></p>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>

      <!-- =================== TAB: ORÁCULO =================== -->
      <div x-show="abaAtiva === 'oraculo'" class="p-5 space-y-4">

        <div class="flex items-start gap-3 bg-[#0d1a13] border border-[#10b981]/20 rounded-xl p-4">
          <span class="text-[#10b981] text-lg mt-0.5">◉</span>
          <div>
            <h2 class="text-[#10b981] font-mono font-bold text-sm uppercase tracking-widest">Radar de Hedge — Oráculo</h2>
            <p class="text-gray-500 text-[11px] mt-0.5">Cruza a probabilidade real da API-Football com a distribuição de apostas do seu bolão. Detecta distorções e alerta Zebras.</p>
          </div>
        </div>

        <!-- Input -->
        <div class="bg-[#0d0d0f] border border-white/5 rounded-xl p-4 space-y-3">
          <p class="text-[9px] font-mono text-gray-600 uppercase tracking-widest">ID DA PARTIDA (fixture_id)</p>
          <div class="flex gap-2">
            <input
              type="number"
              x-model="oraculo.fixtureId"
              @keydown.enter="analisarOraculo()"
              placeholder="ex: 1208098"
              class="flex-1 bg-black border border-white/10 rounded-lg px-3 py-2 font-mono text-[#10b981] text-sm outline-none focus:border-[#10b981]/50 placeholder-gray-700"
            >
            <button
              @click="analisarOraculo()"
              :disabled="oraculo.loading || !oraculo.fixtureId"
              class="px-5 py-2 bg-[#10b981] text-black font-mono font-bold text-xs rounded-lg uppercase tracking-widest disabled:opacity-40 disabled:cursor-not-allowed hover:bg-[#059669] transition-colors"
            >
              <span x-show="!oraculo.loading">ANALISAR</span>
              <span x-show="oraculo.loading" class="flex items-center gap-1.5"><span class="w-3 h-3 border border-black border-t-transparent rounded-full animate-spin"></span>...</span>
            </button>
          </div>
          <p class="text-gray-700 text-[10px] font-mono">Encontre o fixture_id em gm.html → Desafios → Buscar Partida</p>
        </div>

        <!-- Erro -->
        <div x-show="oraculo.erro" class="bg-red-950/30 border border-red-500/30 rounded-xl p-4">
          <p class="text-red-400 font-mono text-xs" x-text="oraculo.erro"></p>
        </div>

        <!-- Resultados -->
        <template x-if="oraculo.predicoes">
          <div class="space-y-3">

            <!-- Alerta Zebra -->
            <template x-if="oraculo.distorcao?.zebraAlert">
              <div class="bg-yellow-950/40 border border-yellow-500/40 rounded-xl p-4 flex items-center gap-3">
                <span class="text-2xl">🦓</span>
                <div>
                  <p class="text-yellow-400 font-mono font-bold text-sm">ALERTA DE ZEBRA DETECTADO</p>
                  <p class="text-yellow-400/70 font-mono text-[11px] mt-0.5">Distorção &gt;25% entre apostas do grupo e probabilidade real. Alto potencial de Zebra Dinâmica.</p>
                </div>
              </div>
            </template>

            <!-- Grid de comparação -->
            <div class="bg-[#0d0d0f] border border-white/5 rounded-xl overflow-hidden">
              <div class="grid grid-cols-4 text-[9px] font-mono text-gray-600 uppercase tracking-widest p-3 border-b border-white/5">
                <span>RESULTADO</span>
                <span class="text-right">API-FOOTBALL</span>
                <span class="text-right">NOSSO BOLÃO</span>
                <span class="text-right">DISTORÇÃO</span>
              </div>

              <template x-for="row in [
                { label: oraculo.predicoes?.teams?.home?.name || 'Casa',  api: oraculo.predicoes?.percent?.home, db: oraculo.distribuicao?.homePct, delta: oraculo.distorcao?.home },
                { label: 'Empate',                                         api: oraculo.predicoes?.percent?.draw, db: oraculo.distribuicao?.drawPct, delta: oraculo.distorcao?.draw },
                { label: oraculo.predicoes?.teams?.away?.name || 'Fora',  api: oraculo.predicoes?.percent?.away, db: oraculo.distribuicao?.awayPct, delta: oraculo.distorcao?.away }
              ]" :key="row.label">
                <div class="grid grid-cols-4 items-center px-3 py-3 border-b border-white/5 last:border-0 hover:bg-white/[0.02] transition-colors">
                  <span class="font-mono text-gray-300 text-xs truncate" x-text="row.label"></span>
                  <div class="text-right">
                    <div class="flex items-center justify-end gap-2">
                      <div class="w-20 bg-white/5 rounded-full h-1 overflow-hidden">
                        <div class="h-full bg-[#10b981] bar-fill rounded-full" :style="'width:' + (row.api || 0) + '%'"></div>
                      </div>
                      <span class="font-mono text-[#10b981] text-xs font-bold w-8 text-right" x-text="(row.api || 0).toFixed(0) + '%'"></span>
                    </div>
                  </div>
                  <div class="text-right">
                    <template x-if="oraculo.distribuicao?.total > 0">
                      <div class="flex items-center justify-end gap-2">
                        <div class="w-20 bg-white/5 rounded-full h-1 overflow-hidden">
                          <div class="h-full bg-indigo-400 bar-fill rounded-full" :style="'width:' + (row.db || 0) + '%'"></div>
                        </div>
                        <span class="font-mono text-indigo-400 text-xs font-bold w-8 text-right" x-text="(row.db || 0).toFixed(0) + '%'"></span>
                      </div>
                    </template>
                    <template x-if="!oraculo.distribuicao?.total">
                      <span class="font-mono text-gray-700 text-xs">sem dados</span>
                    </template>
                  </div>
                  <div class="text-right">
                    <template x-if="oraculo.distorcao">
                      <span
                        class="font-mono text-xs font-bold"
                        :class="Math.abs(parseFloat(row.delta || 0)) > 20
                          ? 'text-yellow-400'
                          : parseFloat(row.delta || 0) > 0
                            ? 'text-red-400'
                            : 'text-gray-500'"
                        x-text="(parseFloat(row.delta || 0) > 0 ? '+' : '') + row.delta + '%'"
                      ></span>
                    </template>
                    <template x-if="!oraculo.distorcao">
                      <span class="font-mono text-gray-700 text-xs">—</span>
                    </template>
                  </div>
                </div>
              </template>
            </div>

            <!-- Meta info -->
            <div class="bg-[#0d0d0f] border border-white/5 rounded-xl p-4 grid grid-cols-2 gap-4">
              <div>
                <p class="text-[9px] font-mono text-gray-600 uppercase tracking-widest mb-1">CONSELHO DA API</p>
                <p class="text-gray-300 font-mono text-xs" x-text="oraculo.predicoes?.advice || '—'"></p>
              </div>
              <div>
                <p class="text-[9px] font-mono text-gray-600 uppercase tracking-widest mb-1">PALPITES NO BOLÃO</p>
                <p class="text-[#10b981] font-mono font-bold text-sm" x-text="(oraculo.distribuicao?.total || 0) + ' votos'"></p>
              </div>
            </div>
          </div>
        </template>
      </div>

      <!-- =================== TAB: DESAFIOS =================== -->
      <div x-show="abaAtiva === 'desafios'" class="p-5 space-y-4">

        <div class="flex items-start gap-3 bg-[#1a0d1a] border border-amber-500/20 rounded-xl p-4">
          <span class="text-amber-400 text-lg mt-0.5">◆</span>
          <div>
            <h2 class="text-amber-400 font-mono font-bold text-sm uppercase tracking-widest">Gerador de Desafios</h2>
            <p class="text-gray-500 text-[11px] mt-0.5">Lance desafios com custo em fichas. O validador de liquidez indica se há apostas suficientes nos dois lados.</p>
          </div>
        </div>

        <!-- Busca de partida -->
        <div class="bg-[#0d0d0f] border border-white/5 rounded-xl p-4 space-y-3">
          <p class="text-[9px] font-mono text-gray-600 uppercase tracking-widest">BUSCAR PARTIDA</p>
          <div class="flex gap-2">
            <input
              type="text"
              x-model="buscaInput"
              @keydown.enter="buscarPartidas()"
              placeholder="Nome do time (ex: Brasil, Argentina...)"
              class="flex-1 bg-black border border-white/10 rounded-lg px-3 py-2 font-mono text-white text-xs outline-none focus:border-amber-500/50 placeholder-gray-700"
            >
            <button
              @click="buscarPartidas()"
              :disabled="buscaLoading"
              class="px-4 py-2 bg-amber-500/20 text-amber-400 font-mono font-bold text-xs rounded-lg border border-amber-500/30 hover:bg-amber-500/30 transition-colors disabled:opacity-40"
            >
              <span x-show="!buscaLoading">BUSCAR</span>
              <span x-show="buscaLoading">...</span>
            </button>
          </div>

          <!-- Resultados da busca -->
          <template x-if="resultadoBusca.length > 0">
            <div class="space-y-1 max-h-52 overflow-y-auto">
              <template x-for="jogo in resultadoBusca" :key="jogo.fixture.id">
                <button
                  @click="selecionarPartida(jogo)"
                  class="w-full text-left p-2.5 bg-black/30 border border-white/5 rounded-lg hover:border-amber-500/30 hover:bg-amber-500/5 transition-all"
                >
                  <div class="flex items-center justify-between">
                    <span class="font-mono text-xs text-white" x-text="jogo.teams.home.name + ' vs ' + jogo.teams.away.name"></span>
                    <span class="font-mono text-[9px] text-gray-600" x-text="new Date(jogo.fixture.date).toLocaleDateString('pt-BR')"></span>
                  </div>
                  <span class="font-mono text-[9px] text-gray-600" x-text="'ID: ' + jogo.fixture.id"></span>
                </button>
              </template>
            </div>
          </template>
        </div>

        <!-- Configuração do desafio -->
        <div class="bg-[#0d0d0f] border border-white/5 rounded-xl p-4 space-y-4">
          <p class="text-[9px] font-mono text-gray-600 uppercase tracking-widest">CONFIGURAR DESAFIO</p>

          <!-- Partida selecionada -->
          <div class="bg-black/40 border border-white/5 rounded-lg p-3">
            <p class="text-[9px] font-mono text-gray-600 mb-1">PARTIDA</p>
            <p class="font-mono text-sm" :class="novoDesafio.match_name ? 'text-white' : 'text-gray-700'" x-text="novoDesafio.match_name || 'Nenhuma selecionada'"></p>
            <p class="font-mono text-[9px] text-gray-700 mt-0.5" x-text="novoDesafio.fixture_id ? 'ID: ' + novoDesafio.fixture_id : ''"></p>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-3">
            <!-- Evento -->
            <div>
              <p class="text-[9px] font-mono text-gray-600 uppercase tracking-widest mb-1.5">TIPO DE EVENTO</p>
              <select x-model="novoDesafio.evento" class="w-full bg-black border border-white/10 rounded-lg px-3 py-2 font-mono text-white text-xs outline-none focus:border-amber-500/50">
                <option value="Goal">Fazer Gol ⚽</option>
                <option value="Assist">Dar Assistência 🎯</option>
                <option value="CornersOver8.5">+8.5 Escanteios 🚩</option>
                <option value="BothTeamsScore">Ambas Marcam ⚽⚽</option>
                <option value="Manual">Manual (abaixo) ✏️</option>
              </select>
            </div>

            <!-- Custo em Fichas -->
            <div>
              <p class="text-[9px] font-mono text-gray-600 uppercase tracking-widest mb-1.5">CUSTO (FICHAS) 🎫</p>
              <input
                type="number" min="1" max="20"
                x-model="novoDesafio.custo_fichas"
                class="w-full bg-black border border-white/10 rounded-lg px-3 py-2 font-mono text-yellow-400 font-bold text-sm outline-none focus:border-yellow-500/50"
              >
            </div>

            <!-- Prêmio em Pontos -->
            <div>
              <p class="text-[9px] font-mono text-gray-600 uppercase tracking-widest mb-1.5">PRÊMIO (PONTOS) ⭐</p>
              <input
                type="number" min="10"
                x-model="novoDesafio.premio_pts"
                class="w-full bg-black border border-white/10 rounded-lg px-3 py-2 font-mono text-[#10b981] font-bold text-sm outline-none focus:border-[#10b981]/50"
              >
            </div>
          </div>

          <!-- Descrição manual -->
          <div>
            <p class="text-[9px] font-mono text-gray-600 uppercase tracking-widest mb-1.5">DESCRIÇÃO MANUAL (opcional)</p>
            <input
              type="text"
              x-model="novoDesafio.descricao"
              placeholder="ex: Quem vai ser o artilheiro da partida?"
              class="w-full bg-black border border-white/10 rounded-lg px-3 py-2 font-mono text-white text-xs outline-none focus:border-white/20 placeholder-gray-700"
            >
          </div>
        </div>

        <!-- Status de Liquidez -->
        <template x-if="liquidezStatus">
          <div
            class="rounded-xl p-4 border font-mono"
            :class="{
              'bg-[#0d1a13] border-[#10b981]/30': liquidezStatus.status === 'ok',
              'bg-yellow-950/30 border-yellow-500/30': liquidezStatus.status === 'baixa',
              'bg-zinc-900 border-white/10': liquidezStatus.status === 'sem_dados'
            }"
          >
            <div class="flex items-center justify-between mb-2">
              <p class="text-[10px] uppercase tracking-widest"
                :class="{ 'text-[#10b981]': liquidezStatus.status === 'ok', 'text-yellow-400': liquidezStatus.status !== 'ok' }"
                x-text="liquidezStatus.label">
              </p>
              <span class="text-[9px] uppercase tracking-widest"
                :class="{ 'text-[#10b981]': liquidezStatus.premiacao === 'integral', 'text-amber-400': liquidezStatus.premiacao === 'migalhas' }"
                x-text="liquidezStatus.premiacao === 'integral' ? 'PRÊMIO INTEGRAL' : 'PRÊMIO: MIGALHAS (10%)'">
              </span>
            </div>
            <p class="text-gray-500 text-[10px]" x-text="liquidezStatus.descricao"></p>
            <template x-if="liquidezStatus.detalhes?.total > 0">
              <div class="flex gap-4 mt-3">
                <span class="text-[9px] text-gray-600">Casa: <span class="text-gray-400" x-text="liquidezStatus.detalhes.raw.home"></span></span>
                <span class="text-[9px] text-gray-600">Empate: <span class="text-gray-400" x-text="liquidezStatus.detalhes.raw.draw"></span></span>
                <span class="text-[9px] text-gray-600">Fora: <span class="text-gray-400" x-text="liquidezStatus.detalhes.raw.away"></span></span>
                <span class="text-[9px] text-gray-600">Total: <span class="text-gray-400" x-text="liquidezStatus.detalhes.total"></span></span>
              </div>
            </template>
          </div>
        </template>

        <!-- Botão de lançamento -->
        <button
          @click="lancarDesafio()"
          :disabled="desafioLancando || !novoDesafio.fixture_id"
          class="w-full py-3 font-mono font-bold text-sm uppercase tracking-widest rounded-xl transition-all disabled:opacity-40 disabled:cursor-not-allowed"
          :class="novoDesafio.fixture_id
            ? 'bg-amber-500 text-black hover:bg-amber-400 active:scale-[0.99]'
            : 'bg-white/5 text-gray-600'"
        >
          <span x-show="!desafioLancando">◆ LANÇAR DESAFIO</span>
          <span x-show="desafioLancando" class="flex items-center justify-center gap-2">
            <span class="w-4 h-4 border-2 border-black border-t-transparent rounded-full animate-spin"></span>
            LANÇANDO...
          </span>
        </button>
      </div>

      <!-- =================== TAB: LOGS =================== -->
      <div x-show="abaAtiva === 'logs'" class="p-5 space-y-3">
        <div class="flex items-center justify-between">
          <p class="text-[9px] font-mono text-gray-600 uppercase tracking-widest">LOG DE REQUISIÇÕES</p>
          <button @click="logs = []; sessionStorage.removeItem('terminal_logs')" class="text-[9px] font-mono text-gray-700 hover:text-red-400 uppercase tracking-widest transition-colors">LIMPAR</button>
        </div>
        <div class="bg-[#08080a] border border-white/5 rounded-xl overflow-hidden font-mono">
          <template x-if="logs.length === 0">
            <div class="p-8 text-center text-gray-700 text-xs">SEM LOGS — EXECUTE UMA OPERAÇÃO</div>
          </template>
          <template x-for="(log, i) in logs" :key="i">
            <div class="flex items-start gap-3 px-4 py-2 border-b border-white/5 last:border-0 hover:bg-white/[0.02] transition-colors text-[10px]">
              <span class="text-gray-700 flex-shrink-0 pt-px" x-text="log.ts"></span>
              <span class="w-24 flex-shrink-0"
                :class="log.status === 'OK' || log.status === 'SUCCESS' ? 'text-[#10b981]' : 'text-red-400'"
                x-text="log.status"></span>
              <span class="text-indigo-400 w-20 flex-shrink-0 truncate" x-text="log.servico"></span>
              <span class="text-gray-500 flex-1 truncate" x-text="log.rota"></span>
              <span class="text-gray-700 flex-shrink-0" x-text="log.ms + 'ms'"></span>
              <span class="text-gray-500 flex-shrink-0 max-w-[200px] truncate" x-text="log.msg"></span>
            </div>
          </template>
        </div>
      </div>

    </div><!-- /content area -->
  </div><!-- /terminal -->
</template>

</body>
</html>
